plugins { id 'com.android.application' }
def baiduProperties = new Properties()
def baiduFile = rootProject.file('baidu.properties')
if (baiduFile.exists()) baiduFile.withInputStream { baiduProperties.load(it) }
def baiduAk = System.getenv('BAIDU_MAP_AK') ?: baiduProperties.getProperty('BAIDU_MAP_AK', '')

android {
    namespace 'com.zhengyaozy.trace'
    compileSdk 35
    defaultConfig {
        applicationId 'com.zhengyaozy.trace'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
        manifestPlaceholders = [BAIDU_MAP_AK: baiduAk]
        buildConfigField 'boolean', 'BAIDU_KEY_CONFIGURED', (!baiduAk.isBlank()).toString()
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.baidu.lbsyun:BaiduMapSDK_Map:9.0.0'
    implementation 'com.baidu.lbsyun:BaiduMapSDK_Search:9.0.0'
    implementation 'com.baidu.lbsyun:BaiduMapSDK_Util:9.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
