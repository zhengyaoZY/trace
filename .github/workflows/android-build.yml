name: Android APK
on:
  push:
    branches: [main, feat/android-bootstrap]
    paths: ['android/**', '.github/workflows/android-build.yml']
  pull_request:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-build.yml']
  workflow_dispatch:
env:
  BAIDU_MAP_AK: ${{ secrets.BAIDU_MAP_AK }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, lint and unit tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: trace-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
  smoke:
    strategy:
      fail-fast: false
      matrix:
        font_scale: ['1.0', '1.3']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          working-directory: android
          script: |
            adb shell settings put system font_scale ${{ matrix.font_scale }}
            ./scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-results-font-${{ matrix.font_scale }}
          path: android/app/build/reports/androidTests/
